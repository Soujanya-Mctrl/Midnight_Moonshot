name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: 3. Install Compact Compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.23.0'

      - name: 4. Install dependencies
        run: yarn install --frozen-lockfile || yarn install

      - name: 5. Compact compile
        run: compact compile contracts/feedback.compact managed/feedback

      - name: 6. Run test suite
        run: npx vitest run tests/feedback.test.ts
