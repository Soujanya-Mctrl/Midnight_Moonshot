name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Install Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Compact Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          if [ -f "$HOME/.local/bin/env" ]; then
            source "$HOME/.local/bin/env"
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.compact/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          compact update 0.24.0
          compact --version

      - name: 4. Install dependencies
        run: npm install

      - name: 5. Compile Compact Contract
        run: |
          if [ -f "$HOME/.local/bin/env" ]; then
            source "$HOME/.local/bin/env"
          fi
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          compact compile contracts/feedback.compact managed/feedback

      - name: 6. Run test suite
        run: npm test

      - name: 7. Build Frontend
        run: npm run build
